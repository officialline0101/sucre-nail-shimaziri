<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>ご予約リンクについてのご案内</title>
  <style>
    :root {
      --bg: #f4f6f5;
      --card: #ffffff;
      --text: #2b2f2e;
      --muted: #6b7471;
      --accent: #06c755;
      --accent-soft: #e6f8ee;
      --warn: #e8833a;
      --warn-soft: #fdf1e7;
      --border: #e3e7e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161918;
        --card: #212524;
        --text: #eef1f0;
        --muted: #a3aba8;
        --accent: #2fd877;
        --accent-soft: #1c3427;
        --warn: #f2a066;
        --warn-soft: #3a2a1e;
        --border: #333836;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.8;
      letter-spacing: 0.02em;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 28px 32px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--warn-soft);
      color: var(--warn);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 36px; height: 36px; }

    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .lead {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .guide {
      background: var(--accent-soft);
      border-radius: 14px;
      padding: 20px 18px;
      text-align: left;
    }

    .guide-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
      text-align: center;
    }

    ol.steps {
      list-style: none;
      counter-reset: step;
      display: grid;
      gap: 12px;
    }
    ol.steps li {
      counter-increment: step;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 0.95rem;
    }
    ol.steps li::before {
      content: counter(step);
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      margin-top: 2px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-label {
      display: inline-block;
      padding: 0 8px;
      margin: 0 2px;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.9em;
      white-space: nowrap;
    }

    .note {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (min-width: 600px) {
      .card { padding: 48px 40px 40px; }
      h1 { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>

    <h1>こちらは現在ご利用いただけない<br>予約リンクになります。</h1>

    <p class="lead">お手数ですが、以下の手順で<br>予約フォームを開きなおしてください。</p>

    <section class="guide" aria-labelledby="guide-title">
      <p class="guide-title" id="guide-title">予約フォームの開き方</p>
      <ol class="steps">
        <li><span>トーク画面下部の<strong>リッチメニュー</strong>を開きます。</span></li>
        <li><span><span class="btn-label">ご予約・メニュー</span>のボタンをタップします。</span></li>
        <li><span>表示された予約フォームからご予約ください。</span></li>
      </ol>
    </section>

    <p class="note">このページを閉じて、トーク画面へお戻りください。</p>
  </main>
</body>
</html>
